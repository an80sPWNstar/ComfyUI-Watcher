name: Publish ComfyUI Node

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

permissions:
  issues: write

jobs:
  publish-node:
    if: github.repository_owner == 'an80sPWNstar'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Publish Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
